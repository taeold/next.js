# Builds the @next/swc-wasm-wasi package (Turbopack + SWC for wasm32-wasip1-threads) from this branch with Next.js's
# own build script and attaches it to a GitHub release named after the tag. Push a tag that starts with "wasi-" to run
# it; the browser-* release workflow takes its WASI package from the release named in WASI_RELEASE there.
name: next-build-in-browser WASI binding

on:
  push:
    tags: ['wasi-*']

permissions:
  contents: write

jobs:
  wasi:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # A release build of the bindings needs more disk than a hosted runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-wasip1-threads

      - name: Build N-API/WASI package
        run: scripts/build-next-swc-wasi.sh

      - name: Pack
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          (cd packages/next-swc-wasm-wasi && npm pack --pack-destination "$out")
          (cd "$out" && sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS)
          df -h /

      - name: Release
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "@next/swc-wasm-wasi built from $GITHUB_SHA with scripts/build-next-swc-wasi.sh. See SHA256SUMS."
        env:
          GH_TOKEN: ${{ github.token }}
