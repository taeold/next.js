# Builds the packages next-build-in-browser uses (https://github.com/taeold/next-build-in-browser) and attaches
# them to a GitHub release named after the tag. Push a tag that starts with "browser-" to run it.
#
# The WASI binding is not built here: it comes from the release in WASI_RELEASE, built from this branch by
# next-build-in-browser-wasi.yml, re-stamped with this release's version.
name: next-build-in-browser release

on:
  push:
    tags: ['browser-*']

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: 1
  WASI_RELEASE: wasi-20261119b

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup corepack
        run: |
          npm i -g corepack@0.31
          corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Set version
        # <canary version>-browser.<sha>, on next and @next/env, with next depending on this @next/env.
        run: |
          node -e '
            const fs = require("fs"), sha = process.env.GITHUB_SHA.slice(0, 7);
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const next = read("packages/next/package.json"), env = read("packages/next-env/package.json");
            const version = `${next.version}-browser.${sha}`;
            next.version = env.version = next.dependencies["@next/env"] = version;
            fs.writeFileSync("packages/next/package.json", JSON.stringify(next, null, 2) + "\n");
            fs.writeFileSync("packages/next-env/package.json", JSON.stringify(env, null, 2) + "\n");
            console.log(version);
          '

      - run: pnpm turbo run build --filter=next --filter=@next/env

      - name: Pack
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          (cd packages/next-env && pnpm pack --pack-destination "$out")
          (cd packages/next && pnpm pack --pack-destination "$out")
          # The WASI binding, re-stamped with this release's version (Next.js warns on a mismatch).
          gh release download "$WASI_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern 'next-swc-wasm-wasi-*.tgz' --dir "$RUNNER_TEMP/wasi"
          mkdir "$RUNNER_TEMP/wasi/pkg" && tar -xzf "$RUNNER_TEMP"/wasi/*.tgz -C "$RUNNER_TEMP/wasi/pkg"
          version=$(node -p 'require("./packages/next/package.json").version')
          (cd "$RUNNER_TEMP/wasi/pkg/package" && npm pkg set version="$version" && npm pack --pack-destination "$out")
          (cd "$out" && sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "next, @next/env and @next/swc-wasm-wasi for next-build-in-browser, built from $GITHUB_SHA. See SHA256SUMS."
        env:
          GH_TOKEN: ${{ github.token }}
